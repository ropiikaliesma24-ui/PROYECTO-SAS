<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Solicitar Soporte - S.A.S</title>
    <link rel="stylesheet" href="styless.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="logo">
                <h1>S.A.S</h1> 
                <img src="img/logsas.png" alt="Logo oficial S.A.S" width="50">
            </div>
            <ul class="inicio">
                <li><a href="index.html" class="nav">Inicio</a></li>
                <li><a href="soporte.html" class="nav">Soporte Técnico</a></li>
                <li><a href="contactos.html" class="nav">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="contacto-form" class="contacto">
            <h2>Pide tu Asistencia Técnica</h2>
            <form id="formularioCita">
                <label for="nombre">Nombre del Cliente / Empresa:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>

                <label for="correo">Correo de contacto:</label>
                <input type="email" id="correo" name="correo" placeholder="usuario@empresa.com" required>

                <label for="servicio">Tipo de incidencia:</label>
                <select id="servicio" name="servicio">
                    <option value="mantenimiento">Mantenimiento de PC</option>
                    <option value="redes">Fallo en la Red / WiFi</option>
                    <option value="servidor">Problemas con Servidor AD</option>
                </select>

                <p>¿Es una urgencia?</p>
                <label><input type="radio" name="cliente" value="si" checked> Sí (Prioridad alta)</label>
                <label><input type="radio" name="cliente" value="no"> No</label>

                <div class="check-group">
                    <input type="checkbox" id="terminos" name="terminos" required>
                    <label for="terminos">Acepto los términos de soporte técnico</label>
                </div>

                <button type="submit" id="btnEnviar">Confirmar Reserva de Técnico</button>
            </form>
        </section>
    </main>

    <footer class="redes-footer">
        <p>&copy; 2026 Copyright - S.A.S Realizado por Iker Andrés</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
